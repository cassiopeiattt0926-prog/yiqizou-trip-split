<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174f3a"><title>一起走 · 旅行记账</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body><main>
<header><button class="round">‹</button><div class="title"><b>东京朋友旅行</b><span>8月12日 — 8月17日 · 日本</span></div><button class="round">•••</button></header>
<section class="hero"><span>旅程总支出</span><h1 id="total">¥0.00</h1><p id="summary"></p><div id="avatars" class="avatars"></div></section>
<nav><button class="active" data-tab="bills">全部账单</button><button data-tab="settle">谁该付谁</button></nav>
<section id="bills" class="content"><div class="section-head"><h2>最近记录</h2><span>按人民币折算</span></div><div id="list" class="list"></div><p class="hint">所有金额按录入时汇率锁定，历史账不会漂移。</p></section>
<section id="settle" class="content hidden"><div class="section-head"><h2>最少转账方案</h2><span id="settleCount"></span></div><div id="balances"></div><div id="transfers" class="transfers"></div><button id="share" class="wide">分享结算单</button></section>
<button id="add" class="fab">＋ 记一笔</button>
</main><dialog id="sheet"><div class="grab"></div><div class="sheet-head"><button data-close>取消</button><h2>记一笔</h2><button id="saveTop">保存</button></div><label>花了多少<div class="amount-row"><select id="currency"><option>CNY</option><option>JPY</option><option>KRW</option><option>USD</option><option>EUR</option></select><input id="amount" inputmode="decimal" placeholder="0"></div></label><p id="conversion"></p><label>事项<input id="item" placeholder="例如：机场去酒店"></label><div class="two"><label>分类<select id="category"><option>餐饮</option><option>打车</option><option>酒店</option><option>门票</option><option>购物</option><option>借用</option><option>退款</option><option>其他</option></select></label><label>谁先付<select id="payer"></select></label></div><label>谁参与<div id="peoplePick" class="people-pick"></div></label><button id="save" class="wide">保存并平均分摊</button></dialog>
<script src="app.js"></script></body></html>
